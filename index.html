<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#07101c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Fluid Pocket Sandbox</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="3D matter sandbox"></canvas>
    <header class="topbar">
      <div><span class="brand">FLUID POCKET</span><span id="status" class="pill">MEDIUM</span></div>
      <div class="top-actions"><button id="pauseBtn">Pause</button><button id="resetBtn">Reset</button><button id="resetViewBtn">Reset view</button></div>
    </header>
    <div id="gravityHud" class="gravity-hud">g 0.00 −1.00 0.00</div>
    <div id="toast" class="toast" aria-live="polite"></div>
    <section class="tool-dock" aria-label="Primary tools">
      <select id="materialSelect" class="fluid-picker" aria-label="Fluid"></select>
      <div class="tool-group" role="group" aria-label="Interaction mode">
        <button id="brushToolBtn" class="tool-btn primary" aria-label="Brush">Brush</button>
        <button id="eraserToolBtn" class="tool-btn" aria-label="Eraser">Eraser</button>
        <button id="cameraToolBtn" class="tool-btn" aria-label="Camera">Camera</button>
      </div>
      <select id="toolSize" class="size-picker" aria-label="Tool size"><option value="S">S</option><option value="M" selected>M</option><option value="L">L</option><option value="XL">XL</option></select>
      <button id="sheetToggleBtn" class="controls-toggle" aria-controls="sheet" aria-expanded="false">Controls</button>
    </section>
    <section id="sheet" class="sheet collapsed">
      <nav class="tabs" aria-label="Sandbox controls">
        <button data-tab="material" class="active">MATERIAL</button><button data-tab="box">BOX</button><button data-tab="rules">RULES</button><button data-tab="env">ENV</button><button data-tab="debug">DEBUG</button>
      </nav>
      <div class="sheet-content">
        <section data-panel="material" class="panel active">
          <div class="row material-head"><button id="addMaterialBtn">Add fluid</button><button id="randomizeBtn">Randomize All</button></div><div class="row"><button id="randomColorBtn">Randomize Color</button><button id="randomPhysicsBtn">Randomize Physics</button><label class="seed-label">Seed <input id="seedInput" type="number" value="1337"></label></div>
          <div id="materialPreview" class="material-preview"><span></span><div><strong id="matName"></strong><small id="matPhaseHint"></small></div></div>
          <div class="grid2">
            <label>Color<input id="color" type="color"></label><label>Opacity<input id="opacity" type="range" min="0.08" max="1" step="0.01"></label>
            <label>Density<input id="density" type="range" min="0.35" max="1.65" step="0.01"></label><label>Viscosity<input id="viscosity" type="range" min="0.02" max="1" step="0.01"></label>
            <label>Miscibility<input id="miscibility" type="range" min="0" max="1" step="0.01"></label><label>Surface tension<input id="cohesion" type="range" min="0" max="1" step="0.01"></label>
            <label>Temperature<input id="temperature" type="range" min="0" max="1" step="0.01"></label><label>Heat capacity<input id="heatCapacity" type="range" min="0.15" max="1" step="0.01"></label>
            <label>Conductivity<input id="thermalConductivity" type="range" min="0.02" max="1" step="0.01"></label><label>Melting point<input id="meltingTemperature" type="range" min="0.05" max="0.6" step="0.01"></label>
            <label>Boiling point<input id="boilingTemperature" type="range" min="0.45" max="0.95" step="0.01"></label><label>Volatility<input id="volatility" type="range" min="0" max="1" step="0.01"></label>
            <label>Reaction potential<input id="reactionPotential" type="range" min="-1" max="1" step="0.01"></label><label>Volume<input id="volume" type="range" min="4" max="80" step="1" value="24"></label>
          </div>
          <div class="row action-row"><button id="pourModeBtn" class="primary">Brush</button><button id="heatModeBtn">Heat</button><button id="coolModeBtn">Cool</button></div><p class="hint gesture-hint">One finger uses the selected tool. Two fingers always control the camera; pinch to zoom.</p>
          <div class="row presets"><button data-preset="mixing">Mixing</button><button data-preset="layers">Layers</button><button data-preset="rain">Rain</button><button data-preset="freeze">Freeze</button><button data-preset="shock">Shock</button></div>
        </section>
        <section data-panel="box" class="panel"><div class="grid2"><label>Width<input id="boxWidth" type="range" min="3" max="12" step="0.1"></label><label>Height<input id="boxHeight" type="range" min="3" max="12" step="0.1"></label><label>Depth<input id="boxDepth" type="range" min="3" max="12" step="0.1"></label></div><p class="hint">Resize clamps all matter safely inside the new bounds.</p></section>
        <section data-panel="rules" class="panel"><div class="grid2"><label>Mix threshold<input id="miscibilityThreshold" type="range" min="0.02" max="0.5" step="0.01"></label><label>Mix speed<input id="baseMixingRate" type="range" min="0.1" max="6" step="0.1"></label><label>Exponent p<input id="mixingExponent" type="range" min="0.5" max="4" step="0.1"></label><label>Reaction strength<input id="reactionStrength" type="range" min="0" max="2" step="0.05"></label><label>Condensation density<input id="condensationDensityThreshold" type="range" min="0.2" max="1.4" step="0.02"></label><label>Cooling coeff.<input id="condensationCoolingCoefficient" type="range" min="0" max="1" step="0.02"></label><label>Thermal diffusion<input id="thermalDiffusionRate" type="range" min="0" max="2" step="0.05"></label></div></section>
        <section data-panel="env" class="panel"><div class="grid2"><label>Environment density<input id="environmentDensity" type="range" min="0.1" max="1.2" step="0.01"></label><label>Ambient temp<input id="ambientTemperature" type="range" min="0" max="1" step="0.01"></label><label>Gravity strength<input id="gravityStrength" type="range" min="1" max="10" step="0.1"></label><label>Sensitivity<input id="sensitivity" type="range" min="0.2" max="2" step="0.05" value="1"></label></div><div class="row"><button id="motionBtn" class="primary">Enable Motion Controls</button><button id="calibrateBtn">Calibrate</button><button id="orientationResetBtn">Reset orientation</button></div><div id="manualPad" class="manual-pad"><div id="manualDot"></div><span>Manual gravity — drag</span></div></section>
        <section data-panel="debug" class="panel"><div id="stats" class="stats"></div><div class="row wrap"><button data-debug="none">Normal</button><button data-debug="temperature">Temperature</button><button data-debug="density">Local Density</button><button data-debug="velocity">Velocity</button><button data-debug="material">Material ID</button><button data-debug="phase">Phase</button><button data-debug="grid">Grid</button></div><div class="row"><select id="quality"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option></select><button id="exportBtn">Export JSON</button><label class="file-btn">Import<input id="importInput" type="file" accept="application/json"></label></div></section>
      </div>
    </section>
  </main>
  <script type="module" src="/src/app/main.mjs"></script>
</body>
</html>
