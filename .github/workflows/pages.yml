name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published site and asset paths
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          echo "Published site: $SITE_URL"
          curl --fail --silent --show-error --location --retry 10 --retry-delay 6 -o /tmp/pages-index.html "${SITE_URL}?probe=${GITHUB_SHA}"
          grep -F 'href="./styles.css /tmp/pages-index.html
          grep -F 'src="./src/app/main.mjs /tmp/pages-index.html
          for asset in styles.css public/base.css public/desktop.css public/fixes.css src/app/main.mjs public/manifest.webmanifest sw.js; do
            echo "Checking: ${SITE_URL}${asset}"
            curl --fail --silent --show-error --location --retry 10 --retry-delay 6 -o /tmp/asset "${SITE_URL}${asset}?probe=${GITHUB_SHA}"
            test -s /tmp/asset
          done
          echo "Live Pages HTML and assets all accessible."
