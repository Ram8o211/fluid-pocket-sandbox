name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Verify playable build before publishing
        run: npm run test:browser
      - name: Verify native LiquidFun physics before publishing
        run: npm run test:liquidfun
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published game and project-relative assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 10 --retry-delay 6 -o /tmp/pages-index.html "${SITE_URL}?probe=${GITHUB_SHA}"
          grep -F 'href="./public/game.css' /tmp/pages-index.html
          grep -F 'src="./src/game/main.mjs' /tmp/pages-index.html
          for asset in public/game.css src/game/main.mjs src/game/brewing.mjs src/game/MaterialRaster.mjs src/simulation/GasDensitySolver.mjs src/simulation/PowderSolver.mjs sandbox.html styles.css public/base.css public/desktop.css public/fixes.css src/app/main.mjs public/manifest.webmanifest sw.js; do
            curl --fail --silent --show-error --location --retry 10 --retry-delay 6 -o /tmp/asset "${SITE_URL}${asset}?probe=${GITHUB_SHA}"
            test -s /tmp/asset
          done
      - name: Play two complete orders on live GitHub Pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:browser
      - name: Verify native physics on live GitHub Pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: npm run test:liquidfun
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-game-verification
          path: test-results
          if-no-files-found: ignore
