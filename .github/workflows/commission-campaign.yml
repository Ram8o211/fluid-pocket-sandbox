name: Commission Campaign Regression
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/game.test.mjs'
      - '.github/workflows/commission-campaign.yml'
  push:
    paths:
      - 'src/**'
      - 'tests/game.test.mjs'
      - '.github/workflows/commission-campaign.yml'
permissions:
  contents: read
jobs:
  complete-seven-orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-name-pattern="complete repeated commissions" tests/game.test.mjs
