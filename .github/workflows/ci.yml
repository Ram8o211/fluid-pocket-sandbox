name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Mobile browser gameplay and sandbox regression
        run: npm run test:browser
      - name: Pixel HUD assets, responsive controls and interactive states
        run: npm run test:hud:browser
      - name: Rabbit colony, dose progression and lifecycle
        run: npm run test:rabbits:browser
      - name: Native LiquidFun particle integrity and full-cauldron stress
        run: npm run test:liquidfun
      - name: GPU fluid surfaces, steam interaction and context recovery
        run: npm run test:fluids:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
      - name: Benchmark metrics
        run: npm run benchmark:game
        continue-on-error: true
